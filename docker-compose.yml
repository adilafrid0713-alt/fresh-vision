version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freshvision_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: freshvision
    ports:
      - '5432:5432'
    volumes:
      - freshvision_pgdata:/var/lib/postgresql/data

volumes:
  freshvision_pgdata:
